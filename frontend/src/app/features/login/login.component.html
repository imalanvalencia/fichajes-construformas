<section class="min-h-screen flex items-center justify-center bg-[#E1E5E7]">
  <div class="w-full max-w-sm px-6">
    <h1 class="font-[Poppins] text-[24px] font-bold text-[#1C1C1D] mb-8">CONSTRUFORMAS</h1>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <div>
        <label class="block font-[JetBrains_Mono] text-[12px] tracking-[0.05em] text-[#ACB4B6] mb-1">EMAIL</label>
        <input type="email" [(ngModel)]="email" name="email" required
          class="w-full bg-transparent border-b border-[#1C1C1D] py-2 text-[16px] font-[Poppins] text-[#1C1C1D] outline-none focus:border-[#E22D2D]" />
      </div>

      <div>
        <label class="block font-[JetBrains_Mono] text-[12px] tracking-[0.05em] text-[#ACB4B6] mb-1">PASSWORD</label>
        <input type="password" [(ngModel)]="password" name="password" required
          class="w-full bg-transparent border-b border-[#1C1C1D] py-2 text-[16px] font-[Poppins] text-[#1C1C1D] outline-none focus:border-[#E22D2D]" />
      </div>

      @if (errorMsg()) {
        <p class="text-[14px] font-[Poppins] text-[#ba1a1a]">{{ errorMsg() }}</p>
      }

      <button type="submit" [disabled]="loading()"
        class="mt-4 bg-[#1C1C1D] text-white font-[Poppins] font-bold py-3 px-6 text-[16px] hover:bg-[#E22D2D] disabled:opacity-50 cursor-pointer">
        {{ loading() ? 'ENTRANDO...' : 'ACCEDER' }}
      </button>
    </form>
  </div>
</section>
