<section class="min-h-screen bg-cement-grey p-8">
  <header class="flex items-center justify-between mb-12 border-b border-steel-grey pb-4">
    <div class="flex items-center gap-8">
      <h1 class="font-poppins text-2xl font-bold text-nero">CONSTRUFORMAS</h1>
      @if (user()?.role === 'ADMIN') {
        <a routerLink="/admin"
          class="font-mono text-xs tracking-widest text-construction-red hover:text-nero">
          ADMIN
        </a>
      }
    </div>
    <button (click)="logout()"
      class="font-mono text-xs tracking-widest text-steel-grey hover:text-construction-red cursor-pointer">
      CERRAR SESION
    </button>
  </header>

  <div class="max-w-5xl">
    <div class="mb-8">
      <p class="font-mono text-xs tracking-widest text-steel-grey mb-2">OPERATOR</p>
      <h2 class="font-poppins text-4xl font-bold text-nero leading-tight">
        {{ user()?.email ?? '—' }}
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="space-y-8">
        <div class="border border-steel-grey p-6">
          <p class="font-mono text-xs tracking-widest text-steel-grey">STATUS</p>
          <p class="font-poppins text-lg text-nero mt-1">Sesion activa</p>
        </div>
        <app-clock-entry />
      </div>
      <app-clock-history />
    </div>
  </div>
</section>
