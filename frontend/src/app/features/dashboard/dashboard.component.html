<section class="min-h-screen bg-[#E1E5E7] p-8">
  <header class="flex items-center justify-between mb-12 border-b border-[#ACB4B6] pb-4">
    <h1 class="font-[Poppins] text-[24px] font-bold text-[#1C1C1D]">CONSTRUFORMAS</h1>
    <button (click)="logout()"
      class="font-[JetBrains_Mono] text-[12px] tracking-[0.05em] text-[#ACB4B6] hover:text-[#E22D2D] cursor-pointer">
      CERRAR SESION
    </button>
  </header>

  <div class="max-w-5xl">
    <p class="font-[JetBrains_Mono] text-[12px] tracking-[0.05em] text-[#ACB4B6] mb-2">OPERATOR</p>
    <h2 class="font-[Poppins] text-[40px] font-bold text-[#1C1C1D] leading-tight">
      {{ user()?.email ?? '—' }}
    </h2>
    <div class="mt-8 border border-[#ACB4B6] p-6">
      <p class="font-[JetBrains_Mono] text-[12px] tracking-[0.05em] text-[#ACB4B6]">STATUS</p>
      <p class="font-[Poppins] text-[18px] text-[#1C1C1D] mt-1">Sesion activa</p>
    </div>
  </div>
</section>
